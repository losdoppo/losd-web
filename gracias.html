<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080d12">
  <title>Gracias por contactarte | LOSD</title><link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg"><link rel="stylesheet" href="styles.css">
  <style>.thanks-page{min-height:100vh;display:grid;place-items:center;padding:30px;background:radial-gradient(ellipse at 50% 30%,rgba(0,215,233,.12),transparent 45%),#080d12}.thanks-card{width:min(600px,100%);padding:55px 40px;border:1px solid rgba(0,215,233,.3);border-radius:18px;text-align:center;background:#101b23}.thanks-mark{font-size:25px;font-weight:800;letter-spacing:.08em}.thanks-mark span{color:var(--cyan)}.thanks-card h1{font-size:42px;line-height:1.05;letter-spacing:-.05em;margin:25px 0 12px}.thanks-card p{color:#9aabb3;font-size:13px;margin:0 auto 25px;max-width:440px}.thanks-symbol{width:58px;height:58px;margin:0 auto 20px;border:1px solid rgba(0,215,233,.5);border-radius:50%;display:grid;place-items:center;color:var(--cyan);font-size:25px}@media(max-width:500px){.thanks-card{padding:35px 20px}.thanks-card h1{font-size:34px}}</style>
</head>
<body><main class="thanks-page"><div class="thanks-card"><div class="thanks-mark">LOSD<span>.TV</span></div><div class="thanks-symbol">✓</div><span class="section-kicker">MENSAJE RECIBIDO</span><h1>¡Gracias por sumarte!</h1><p>Tu información fue enviada. El equipo LOSD podrá contactarte con novedades, información o próximos pasos según tu consulta.</p><a class="button button-primary" href="index.html">Volver al sitio <span>↗</span></a></div></main></body>
</html>
